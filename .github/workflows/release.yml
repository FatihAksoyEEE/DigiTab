# v ile başlayan bir etiket (ör. v1.0.0) gönderildiğinde macOS ve Windows kurulum
# dosyalarını derler ve GitHub Releases sayfasında yayınlar.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run electron:build:server

      - name: Kurulum dosyalarını derle
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Sürümü yayınla
        # Sürüm zaten varsa (ör. iş akışı yeniden çalıştırıldıysa) dosyaları güncelle
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --title "DigiTab POS $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
